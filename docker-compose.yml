# Alternative to the embedded Postgres (set EMBEDDED_PG=false in .env when using this).
#   docker compose up -d
#   npm run setup
#   npm run dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rankpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rankpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outgoing report emails in dev: UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
